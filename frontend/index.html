<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      (function () {
        var preference = 'dark';
        try {
          var storedPreference = localStorage.getItem('vnstock_theme');
          if (storedPreference === 'dark' || storedPreference === 'light' || storedPreference === 'system') {
            preference = storedPreference;
          }
        } catch (_) {
          // Keep the dark default when storage is unavailable.
        }

        var theme = preference;
        if (preference === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VNStock Hub - Vietnam Stock Market Trading and Investment Dashboard" />
    <meta name="keywords" content="vietnam stocks, VN-100, stock trading, investment, vnstock" />
    <title>VNStock Hub - Vietnam Stock Market Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
