services:
  backend:
    build:
      context: ./backend
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-unknown}
    image: ${BACKEND_IMAGE:-vnstock-hub/vnstock-hub-backend}:${IMAGE_TAG:-latest}
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BUILD_NUMBER: ${BUILD_NUMBER:-unknown}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3030","http://localhost:5173"]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-[]}
      SYNC_ADMIN_EMAILS: ${SYNC_ADMIN_EMAILS:-[]}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8020}
        VITE_APP_BUILD: ${BUILD_NUMBER:-unknown}
    image: ${FRONTEND_IMAGE:-vnstock-hub/vnstock-hub-frontend}:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3030}:80"
    depends_on:
      - backend

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-vnstock-hub}
